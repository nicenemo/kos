#!/usr/bin/env ansible-playbook
---
- name: Remove the HID-BPF Loader of the Nachtgespenst Pad
  hosts: systems
  become: true

  tasks:
    - name: Stop the loader instances (this detaches the programs)
      ansible.builtin.command: systemctl stop 'nachtgespenst-hid-bpf@*.service'  # noqa command-instead-of-module
      register: hid_bpf_stop
      changed_when: hid_bpf_stop.rc == 0
      failed_when: false

    - name: Remove the udev rule, the unit and the loader directory
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/udev/rules.d/71-nachtgespenst-hid-bpf.rules
        - /etc/systemd/system/nachtgespenst-hid-bpf@.service
        - /opt/nachtgespenst-hid-bpf
        - /sys/fs/bpf/nachtgespenst
      notify:
        - Reload systemd
        - Reload udev

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Reload udev
      ansible.builtin.command: udevadm control --reload-rules
      changed_when: true
