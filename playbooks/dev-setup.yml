#!/usr/bin/env ansible-playbook
---
# Development tooling: PlatformIO, esptool, JBang, JDK and build tools. udev rules are in udev-setup.yml.
# Used for e.g. https://github.com/nicenemo/nachtgespenst, which is not cloned here.
- name: Install Development Tooling
  hosts: systems
  become: true

  tasks:
    # -------------------------------------------------------------------------
    # 1. System packages (platformio-core-udev ships the generic PlatformIO board rules)
    # -------------------------------------------------------------------------
    - name: Install build prerequisites and PlatformIO
      community.general.pacman:
        name:
          - python
          - python-pip
          - platformio-core
          - platformio-core-udev
          - cmake
          - ninja
          - unzip
          - jdk-openjdk
          - v4l-utils
          - esptool
        state: present

    # -------------------------------------------------------------------------
    # 2. JBang (system-wide)
    # -------------------------------------------------------------------------
    - name: Download JBang
      ansible.builtin.get_url:
        url: https://github.com/jbangdev/jbang/releases/latest/download/jbang.zip
        dest: /var/cache/jbang.zip
        mode: "0644"

    - name: Unpack JBang
      ansible.builtin.unarchive:
        src: /var/cache/jbang.zip
        dest: /opt
        remote_src: true
        creates: "{{ jbang_install_dir }}/bin/jbang"

    - name: Link jbang into /usr/local/bin
      ansible.builtin.file:
        src: "{{ jbang_install_dir }}/bin/jbang"
        dest: /usr/local/bin/jbang
        state: link
