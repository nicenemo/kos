#!/usr/bin/env ansible-playbook
---
- name: Remove Nachtgespenst Build Tooling
  hosts: systems
  become: true

  tasks:
    - name: Remove JBang and udev rules
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /usr/local/bin/jbang
        - "{{ jbang_install_dir }}"
        - /var/cache/jbang.zip
        - /etc/udev/rules.d/99-kos-esp32.rules
      notify: Reload udev

    - name: Remove PlatformIO and esptool
      community.general.pacman:
        name:
          - platformio-core
          - platformio-core-udev
          - esptool
        state: absent

  handlers:
    - name: Reload udev
      ansible.builtin.command: udevadm control --reload-rules
      changed_when: true
