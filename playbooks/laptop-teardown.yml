#!/usr/bin/env ansible-playbook
---
- name: Revert Laptop Settings
  hosts: systems
  become: true

  tasks:
    - name: Remove the kos TLP drop-ins
      ansible.builtin.file:
        path: "/etc/tlp.d/{{ item }}"
        state: absent
      loop:
        - 99-kos.conf
        - 98-kos-lamp-tests.conf

    - name: Unmask the rfkill units
      ansible.builtin.systemd:
        name: "{{ item }}"
        masked: false
      loop:
        - systemd-rfkill.service
        - systemd-rfkill.socket

    - name: Disable thermald
      ansible.builtin.systemd:
        name: thermald.service
        enabled: false
        state: stopped
      failed_when: false

    - name: Remove thermald
      community.general.pacman:
        name: thermald
        state: absent

    # TLP and the power-profiles-daemon mask stay: that is how this machine ran before these playbooks.
