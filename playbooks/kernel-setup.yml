#!/usr/bin/env ansible-playbook
---
- name: Install CachyOS Kernel and Configure systemd-boot (sdboot-manage)
  hosts: systems
  become: true

  vars:
    project_root: "{{ playbook_dir | dirname }}"
    loader_conf: /boot/loader/loader.conf

  tasks:
    # -------------------------------------------------------------------------
    # 1. Packages (the pacman hooks generate the boot entries via sdboot-manage)
    # -------------------------------------------------------------------------
    - name: Install systemd-boot-manager, CachyOS kernel, headers and Intel microcode
      community.general.pacman:
        name: "{{ ['systemd-boot-manager'] + kernel_packages }}"
        state: present
      notify: Rebuild initramfs

    # -------------------------------------------------------------------------
    # 2. Kernel command line: drop-in for sdboot-manage (LINUX_OPTIONS is extended, /etc/sdboot-manage.conf stays)
    # -------------------------------------------------------------------------
    - name: Ensure the sdboot-manage drop-in directory exists
      ansible.builtin.file:
        path: /etc/sdboot-manage.conf.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Read the kernel tuning parameters
      ansible.builtin.set_fact:
        kernel_options: >-
          {{ lookup('ansible.builtin.file', project_root ~ '/files/kos-tuning.conf').splitlines()
          | map('trim') | reject('match', '(#|$)') | list }}

    - name: Read the base sdboot-manage configuration
      ansible.builtin.slurp:
        src: /etc/sdboot-manage.conf
      register: sdboot_base_conf

    # Only options that are not yet in the base LINUX_OPTIONS are added, so no parameter appears twice.
    - name: Determine the missing kernel options
      ansible.builtin.set_fact:
        missing_kernel_options: >-
          {{ kernel_options | reject('in', base_options.split()) | list }}
      vars:
        base_options: >-
          {{ sdboot_base_conf.content | b64decode | regex_findall('(?m)^LINUX_OPTIONS="(.*)"$') | first | default('') }}

    - name: Deploy kernel options drop-in
      ansible.builtin.copy:
        dest: /etc/sdboot-manage.conf.d/99-kos.conf
        content: |
          LINUX_OPTIONS+=" {{ missing_kernel_options | join(' ') }}"
        owner: root
        group: root
        mode: "0644"
      when: missing_kernel_options | length > 0
      notify: Regenerate systemd-boot entries

    - name: Remove the kernel options drop-in when the base configuration has everything
      ansible.builtin.file:
        path: /etc/sdboot-manage.conf.d/99-kos.conf
        state: absent
      when: missing_kernel_options | length == 0
      notify: Regenerate systemd-boot entries

    # -------------------------------------------------------------------------
    # 3. Default boot entry (DEFAULT_ENTRY is "manual", so loader.conf is ours)
    # -------------------------------------------------------------------------
    - name: Check that loader.conf exists
      ansible.builtin.stat:
        path: "{{ loader_conf }}"
      register: loader_conf_stat

    - name: Boot the CachyOS kernel by default
      ansible.builtin.lineinfile:
        path: "{{ loader_conf }}"
        regexp: '^default\s'
        line: "default {{ boot_default_entry }}"
        insertbefore: BOF
        mode: "0755"
      when: loader_conf_stat.stat.exists

    # -------------------------------------------------------------------------
    # 4. Kernel sysctl tuning
    # -------------------------------------------------------------------------
    - name: Install sysctl tuning
      ansible.builtin.copy:
        src: "{{ project_root }}/files/99-kos-sysctl.conf"
        dest: /etc/sysctl.d/99-kos.conf
        owner: root
        group: root
        mode: "0644"
      notify: Apply sysctl settings

    # -------------------------------------------------------------------------
    # 4. Kernel modules: i915 options and loading at boot (as the iGPU setup of mikmakmuk does in kernel-setup)
    # -------------------------------------------------------------------------
    - name: Install i915 module options
      ansible.builtin.copy:
        src: "{{ project_root }}/files/99-kos-i915.conf"
        dest: /etc/modprobe.d/99-kos-i915.conf
        owner: root
        group: root
        mode: "0644"
      notify: Rebuild initramfs

    - name: Ensure the i915 module is loaded at boot
      ansible.builtin.copy:
        content: "i915\n"
        dest: /etc/modules-load.d/igpu.conf
        owner: root
        group: root
        mode: "0644"

    # -------------------------------------------------------------------------
    # 5. Verification (no automatic reboot: this play runs on the machine itself)
    # -------------------------------------------------------------------------
    - name: Read the running kernel command line
      ansible.builtin.slurp:
        src: /proc/cmdline
      register: live_cmdline_raw

    - name: Report parameters that need a reboot to become active
      ansible.builtin.debug:
        msg: >-
          Reboot required: not yet in /proc/cmdline:
          {{ kernel_options | difference((live_cmdline_raw.content | b64decode).split()) | join(' ') }}
      when: kernel_options | difference((live_cmdline_raw.content | b64decode).split()) | length > 0

  handlers:
    - name: Rebuild initramfs
      ansible.builtin.command: mkinitcpio -P
      changed_when: true

    - name: Regenerate systemd-boot entries
      ansible.builtin.command: sdboot-manage gen
      changed_when: true

    - name: Apply sysctl settings
      ansible.builtin.command: sysctl --system
      changed_when: true
