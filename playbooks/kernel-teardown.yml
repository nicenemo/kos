#!/usr/bin/env ansible-playbook
---
- name: Revert Kernel Setup
  hosts: systems
  become: true

  tasks:
    # The stock `linux` kernel and intel-ucode stay: the machine must remain bootable.
    - name: Remove the CachyOS kernel packages
      community.general.pacman:
        name:
          - linux-cachyos
          - linux-cachyos-headers
        state: absent
