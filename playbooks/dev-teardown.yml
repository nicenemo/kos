#!/usr/bin/env ansible-playbook
---
- name: Remove Development Tooling
  hosts: systems
  become: true

  tasks:
    - name: Remove JBang
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /usr/local/bin/jbang
        - "{{ jbang_install_dir }}"
        - /var/cache/jbang.zip

    - name: Remove PlatformIO and esptool
      community.general.pacman:
        name:
          - platformio-core
          - platformio-core-udev
          - esptool
        state: absent
