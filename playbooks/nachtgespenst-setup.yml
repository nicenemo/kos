#!/usr/bin/env ansible-playbook
---
# Build tooling for https://github.com/nicenemo/nachtgespenst (PlatformIO firmware + JBang tools).
# The repo itself is not cloned here; see its docs/wiki/tooling.md (PlatformIO venv per project, JBang fetches a JDK).
- name: Install Nachtgespenst Build Tooling
  hosts: systems
  become: true

  vars:
    project_root: "{{ playbook_dir | dirname }}"

  tasks:
    # -------------------------------------------------------------------------
    # 1. System packages (platformio-core-udev ships the generic PlatformIO board rules)
    # -------------------------------------------------------------------------
    - name: Install build prerequisites and PlatformIO
      community.general.pacman:
        name:
          - python
          - python-pip
          - platformio-core
          - platformio-core-udev
          - cmake
          - ninja
          - unzip
          - jdk-openjdk
          - v4l-utils
          - esptool
        state: present

    # -------------------------------------------------------------------------
    # 2. Serial access to the M5Stack boards
    # -------------------------------------------------------------------------
    - name: Add target user to uucp (serial ports)
      ansible.builtin.user:
        name: "{{ target_user }}"
        groups: uucp
        append: true

    - name: Install udev rules for the ESP32 boards
      ansible.builtin.copy:
        src: "{{ project_root }}/files/99-kos-esp32-udev.rules"
        dest: /etc/udev/rules.d/99-kos-esp32.rules
        owner: root
        group: root
        mode: "0644"
      notify: Reload udev

    # -------------------------------------------------------------------------
    # 3. JBang (system-wide)
    # -------------------------------------------------------------------------
    - name: Download JBang
      ansible.builtin.get_url:
        url: https://github.com/jbangdev/jbang/releases/latest/download/jbang.zip
        dest: /var/cache/jbang.zip
        mode: "0644"

    - name: Unpack JBang
      ansible.builtin.unarchive:
        src: /var/cache/jbang.zip
        dest: /opt
        remote_src: true
        creates: "{{ jbang_install_dir }}/bin/jbang"

    - name: Link jbang into /usr/local/bin
      ansible.builtin.file:
        src: "{{ jbang_install_dir }}/bin/jbang"
        dest: /usr/local/bin/jbang
        state: link

  handlers:
    - name: Reload udev
      ansible.builtin.command: udevadm control --reload-rules
      changed_when: true
