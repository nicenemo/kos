#!/usr/bin/env ansible-playbook
---
- name: Install Intel Broadwell (HD Graphics 5500) Graphics Stack
  hosts: systems
  become: true

  tasks:
    # Broadwell (Gen8) is not supported by intel-media-driver (Gen9+); it needs the legacy i965 VA-API driver.
    - name: Install Mesa, Vulkan and VA-API packages
      community.general.pacman:
        name:
          - mesa
          - vulkan-intel
          - libva-intel-driver
          - libva-utils
          - intel-gpu-tools
          - vulkan-tools
        state: present

    - name: Select the i965 VA-API driver system-wide
      ansible.builtin.copy:
        dest: /etc/environment.d/99-kos-vaapi.conf
        content: "LIBVA_DRIVER_NAME=i965\n"
        owner: root
        group: root
        mode: '0644'

    - name: Install i915 module options
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/99-kos-i915.conf"
        dest: /etc/modprobe.d/99-kos-i915.conf
        owner: root
        group: root
        mode: '0644'
