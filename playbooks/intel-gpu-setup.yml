#!/usr/bin/env ansible-playbook
---
- name: Install Intel Broadwell (HD Graphics 5500) Graphics Stack
  hosts: systems
  become: true

  vars:
    project_root: "{{ playbook_dir | dirname }}"

  tasks:
    # Broadwell (Gen8) is not supported by intel-media-driver (Gen9+); it needs the legacy i965 VA-API driver.
    - name: Install Mesa, Vulkan, VA-API and diagnostic packages
      community.general.pacman:
        name:
          - mesa
          - vulkan-intel
          - vulkan-icd-loader
          - libva-intel-driver
          - libva-utils
          - vulkan-tools
          - clinfo
          - intel-gpu-tools
        state: present

    - name: Ensure /etc/environment.d exists
      ansible.builtin.file:
        path: /etc/environment.d
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Select the iris Mesa driver and i965 VA-API driver system-wide
      ansible.builtin.copy:
        src: "{{ project_root }}/files/99-kos-igpu-dri.conf"
        dest: /etc/environment.d/99-kos-igpu-dri.conf
        owner: root
        group: root
        mode: '0644'
