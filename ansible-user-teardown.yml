#!/usr/bin/env ansible-playbook
---
- name: Remove Managed Node Ansible User
  hosts: all
  gather_facts: false
  become: true
  vars:
    ansible_connection: local
    ansible_user: "{{ bootstrap_user }}"
    ansible_ssh_private_key_file: ""

  tasks:
    - name: Remove passwordless sudoers file for management user
      ansible.builtin.file:
        path: "/etc/sudoers.d/{{ ansible_management_user }}"
        state: absent

    - name: Remove management user account and home directory
      ansible.builtin.user:
        name: "{{ ansible_management_user }}"
        state: absent
        remove: true
        force: true

    - name: Remove the localhost-only sshd configuration
      ansible.builtin.file:
        path: /etc/ssh/sshd_config.d/99-kos-local.conf
        state: absent

    - name: Stop and disable sshd
      ansible.builtin.systemd:
        name: sshd.service
        enabled: false
        state: stopped
      failed_when: false

    # openssh stays installed: other things on the machine may depend on it.
