#!/usr/bin/env ansible-playbook
---
# kos manages itself over SSH on 127.0.0.1 as the ansible management user, like the mikmakmuk nodes.
# This bootstrap runs locally as bootstrap_user (needs -K), so it works before sshd or the user exist.
- name: Bootstrap Managed Node (Ansible User and Local SSH)
  hosts: all
  gather_facts: false
  become: true
  vars:
    ansible_connection: local
    ansible_user: "{{ bootstrap_user }}"
    ansible_ssh_private_key_file: ""

  tasks:
    - name: Install OpenSSH server
      community.general.pacman:
        name: openssh
        state: present

    - name: Restrict sshd to localhost with key authentication only
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/99-kos-local.conf
        content: |
          ListenAddress 127.0.0.1
          PasswordAuthentication no
          KbdInteractiveAuthentication no
        owner: root
        group: root
        mode: '0644'
      notify: Restart sshd

    - name: Enable and start sshd
      ansible.builtin.systemd:
        name: sshd.service
        enabled: true
        state: started

    - name: Create Ansible management user on target node
      ansible.builtin.user:
        name: "{{ ansible_management_user }}"
        groups: wheel
        append: true
        shell: /bin/bash

    - name: Add Ansible control node public key for SSH access
      ansible.posix.authorized_key:
        user: "{{ ansible_management_user }}"
        state: present
        key: "{{ lookup('file', lookup('env', 'HOME') + '/.ssh/id_ed25519_ansible.pub') }}"

    - name: Configure passwordless sudo
      ansible.builtin.copy:
        dest: "/etc/sudoers.d/{{ ansible_management_user }}"
        content: "{{ ansible_management_user }} ALL=(ALL) NOPASSWD: ALL\n"
        owner: root
        group: root
        mode: '0440'
        validate: 'visudo -cf %s'

  handlers:
    - name: Restart sshd
      ansible.builtin.systemd:
        name: sshd.service
        state: restarted
