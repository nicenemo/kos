---
all:
  vars:
    bootstrap_user: kruse
    ansible_management_user: myansibleuser
    ansible_user: "{{ ansible_management_user }}"
    ansible_python_interpreter: /usr/bin/python3
    # clang and llvm compile BPF programs, libbpf and bpftool (package bpf) load and inspect them (ADR 0016)
    hid_bpf_packages:
      - clang
      - llvm
      - libbpf
      - bpf
    common_packages:
      - neovim
      - jq
      - tmux
      - btop
      - wget
      - git
      - base-devel
      - networkmanager
      - lm_sensors
      - bubblewrap
      - socat
      - gitleaks
      - ansible-lint
      - yamllint
      - markdownlint-cli2
      - actionlint
      - osv-scanner
    # systemd-boot is managed with sdboot-manage (systemd-boot-manager): entries are named after the kernel
    kernel_packages:
      - linux-cachyos
      - linux-cachyos-headers
      - intel-ucode
    boot_default_entry: linux-cachyos.conf
    boot_fallback_entry: linux.conf
    desktop_packages:
      - vivaldi
      - vivaldi-ffmpeg-codecs
      - proton-mail-bin
      - moonlight-qt
    battery_start_threshold: 75
    battery_stop_threshold: 80
    jbang_install_dir: /opt/jbang
    jdtls_version: 1.63.0

  children:
    systems:
      hosts:
        kos:
          ansible_host: 127.0.0.1
          target_user: kruse
