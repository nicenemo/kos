[defaults]
inventory = inventory.yml
host_key_checking = False
stdout_callback = default
result_format = yaml
bin_ansible_callbacks = True
forks = 5
timeout = 30
remote_tmp = ~/.ansible/tmp
local_tmp  = ~/.ansible/tmp

[privilege_escalation]
# kos configures itself (connection: local), so there is no ansible management user: sudo asks for your password.
become = True
become_method = sudo
become_user = root
become_ask_pass = True
